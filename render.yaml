services:
  - type: web
    name: freshwallet-web
    runtime: static
    buildCommand: npm install && npm run build
    publishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false # User will input their backend URL here (e.g. https://freshwallet-api.onrender.com/api/v1)
    routes:
      # This handles React Router Client-Side Routing (SPA)
      - type: rewrite
        source: /*
        destination: /index.html
