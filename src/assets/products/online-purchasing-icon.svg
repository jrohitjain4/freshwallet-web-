<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="shopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9A3C" />
      <stop offset="100%" stop-color="#FF6B00" />
    </linearGradient>
    <linearGradient id="bagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A00" />
      <stop offset="100%" stop-color="#E05600" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="cartShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background Base Container -->
  <rect x="14" y="14" width="72" height="72" rx="14" fill="#FFFFFF" stroke="#FFE4D6" stroke-width="1.5" filter="url(#cartShadow)" />

  <!-- Delivery Parcel Box (Behind bag) -->
  <polygon points="56,30 76,38 76,58 56,50" fill="url(#boxGrad)" />
  <polygon points="36,38 56,30 56,50 36,58" fill="#F59E0B" />
  <polygon points="36,38 56,30 76,38 56,46" fill="#FDE68A" />
  <!-- Box Tape -->
  <line x1="56" y1="30" x2="56" y2="50" stroke="#B45309" stroke-width="2" stroke-dasharray="2 1" />

  <!-- Vibrant Shopping Bag -->
  <path d="M 28 42 L 64 42 L 68 76 L 24 76 Z" fill="url(#bagGrad)" filter="url(#cartShadow)" rx="3" />
  
  <!-- Bag Handle -->
  <path d="M 38 42 C 38 30, 54 30, 54 42" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />

  <!-- Shopping Tag / Percentage Star -->
  <circle cx="46" cy="58" r="8" fill="#FFFFFF" />
  <path d="M 43 55 L 49 61 M 49 55 L 43 61" stroke="#FF6B00" stroke-width="2" stroke-linecap="round" />
  <circle cx="43" cy="55" r="1.2" fill="#FF6B00" />
  <circle cx="49" cy="61" r="1.2" fill="#FF6B00" />

  <!-- Floating Fast Delivery Badge -->
  <rect x="52" y="66" width="30" height="12" rx="4" fill="#10B981" filter="url(#cartShadow)" />
  <text x="67" y="75" font-family="'Inter', sans-serif" font-weight="900" font-size="6.5" fill="#FFFFFF" text-anchor="middle">ONLINE</text>
</svg>
