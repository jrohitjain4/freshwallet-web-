<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="mitraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9A3C" />
      <stop offset="100%" stop-color="#FF6B00" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="mitraShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background Base Container -->
  <rect x="14" y="14" width="72" height="72" rx="14" fill="#FFFFFF" stroke="#FFE4D6" stroke-width="1.5" filter="url(#mitraShadow)" />

  <!-- Kiosk / Computer Screen -->
  <rect x="24" y="24" width="52" height="36" rx="6" fill="#1E293B" />
  <rect x="27" y="27" width="46" height="30" rx="4" fill="#FFF7ED" stroke="#FFD8BF" stroke-width="1" />
  
  <!-- Screen Elements -->
  <rect x="31" y="32" width="18" height="4" rx="2" fill="#FF6B00" />
  <rect x="31" y="39" width="38" height="3" rx="1.5" fill="#94A3B8" />
  <rect x="31" y="45" width="28" height="3" rx="1.5" fill="#94A3B8" />

  <!-- Digital Stamp / Fingerprint / Smart Badge on Screen -->
  <circle cx="62" cy="35" r="5" fill="#10B981" />
  <path d="M 59.5 35 L 61.5 37 L 65 33.5" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Kiosk Stand -->
  <rect x="44" y="60" width="12" height="8" fill="#64748B" />
  <path d="M 34 68 L 66 68 L 70 74 L 30 74 Z" fill="#475569" rx="2" />

  <!-- E-Mitra Badge Ribbon -->
  <rect x="22" y="70" width="56" height="14" rx="4" fill="url(#mitraGrad)" filter="url(#mitraShadow)" />
  <text x="50" y="80.5" font-family="'Inter', sans-serif" font-weight="900" font-size="8" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">e-MITRA</text>
</svg>
