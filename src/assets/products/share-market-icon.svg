<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bullGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9A3C" />
      <stop offset="100%" stop-color="#FF6B00" />
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background Base Container -->
  <rect x="14" y="14" width="72" height="72" rx="14" fill="#FFFFFF" stroke="#FFE4D6" stroke-width="1.5" filter="url(#glow)" />

  <!-- Candlesticks / Bars -->
  <!-- Bar 1 -->
  <line x1="28" y1="48" x2="28" y2="72" stroke="#FF6B00" stroke-width="1.5" />
  <rect x="24" y="52" width="8" height="16" rx="2" fill="#FF8A00" />

  <!-- Bar 2 -->
  <line x1="42" y1="36" x2="42" y2="68" stroke="#10B981" stroke-width="1.5" />
  <rect x="38" y="40" width="8" height="22" rx="2" fill="#10B981" />

  <!-- Bar 3 -->
  <line x1="56" y1="28" x2="56" y2="60" stroke="#10B981" stroke-width="1.5" />
  <rect x="52" y="32" width="8" height="24" rx="2" fill="#10B981" />

  <!-- Bar 4 (Peak) -->
  <line x1="70" y1="20" x2="70" y2="52" stroke="#10B981" stroke-width="1.5" />
  <rect x="66" y="24" width="8" height="24" rx="2" fill="url(#bullGrad)" />

  <!-- Dynamic Upward Trend Line -->
  <path d="M 22 68 Q 38 52 50 42 T 76 20" fill="none" stroke="#FF6B00" stroke-width="3.5" stroke-linecap="round" />
  
  <!-- Arrow Head -->
  <polygon points="78,16 68,18 76,26" fill="#FF6B00" />

  <!-- Rupee Coin Icon Badge -->
  <circle cx="72" cy="70" r="11" fill="url(#orangeGrad)" filter="url(#glow)" />
  <text x="72" y="75" font-family="'Inter', sans-serif" font-weight="900" font-size="12" fill="#FFFFFF" text-anchor="middle">₹</text>
</svg>
