<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 125" width="100%" height="100%">
  <!-- Orange Shield Backdrop -->
  <path d="M 55 12 L 95 25 L 95 75 Q 95 100 55 116 Q 15 100 15 75 L 15 25 Z" fill="#FF6B00" />
  
  <!-- Background faint letters -->
  <text x="36" y="72" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="48" fill="#FFFFFF" opacity="0.18" text-anchor="middle">F</text>
  <text x="74" y="72" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="48" fill="#FFFFFF" opacity="0.18" text-anchor="middle">W</text>
  
  <!-- White Card/Document Container -->
  <rect x="31" y="62" width="48" height="34" rx="2" fill="#FFFFFF" />
  
  <!-- Orange Top Flap (Divided into 4 segments) -->
  <polygon points="28,62 40.5,62 42.5,56 32,56" fill="#EA580C" />
  <polygon points="42,62 54,62 54,56 43.5,56" fill="#EA580C" />
  <polygon points="56,62 68,62 66.5,56 56,56" fill="#EA580C" />
  <polygon points="69.5,62 82,62 78,56 67.5,56" fill="#EA580C" />
  
  <!-- Warm Orange Inner Screen -->
  <rect x="35" y="67" width="40" height="24" rx="1" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1" />
  
  <!-- Inner Screen Accent Line -->
  <rect x="39" y="77" width="32" height="4" fill="#FF6B00" rx="0.5" />
</svg>
